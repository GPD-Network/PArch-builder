[package]
name = "siali"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[[bin]]
name = "siali"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
directories = "6.0.0"
downloader = "0.2.8"
glob = "0.3.4"
indicatif = "0.18.6"
reqwest = { version = "0.13", features = ["blocking"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_yaml = "0.9.34"
tempdir = "0.3.7"
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }
url = { version = "2.5.8", features = ["serde"] }

[dev-dependencies]
tempfile = "3.27.0"
